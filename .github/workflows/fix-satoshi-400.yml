name: fix-satoshi-400
on:
  push:
    paths:
      - ".github/workflows/fix-satoshi-400.yml"
      - "scripts/satoshi-400.b64"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply five known substitutions
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess, sys
          p = "scripts/satoshi-400.b64"
          data = bytearray(open(p, "rb").read())
          expected = "1d38a3669e5e4b1d5675447742fef41edbd6949a"
          gitsha = hashlib.sha1(b"blob %d\0" % len(data) + bytes(data)).hexdigest()
          if gitsha == expected:
              print("already correct", gitsha)
              sys.exit(0)
          fixes = {11700: 56, 16360: 90, 25007: 74, 29669: 51, 29754: 108}
          for i, c in fixes.items():
              if i >= len(data):
                  raise SystemExit(f"index {i} out of range {len(data)}")
              data[i] = c
          newsha = hashlib.sha1(b"blob %d\0" % len(data) + bytes(data)).hexdigest()
          if newsha != expected:
              raise SystemExit(f"patch produced {newsha} wanted {expected}")
          open(p, "wb").write(data)
          print("patched to", newsha)
          PY
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/satoshi-400.b64
          if git diff --cached --quiet; then
            echo "no commit"
          else
            git commit -m "Fix satoshi-400.b64 five-byte transcription errors"
            git push
          fi
