name: assemble-search-index
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-search-index.yml"
      - "scripts/assemble-search-index.py"
      - "scripts/search-index/_probe-*"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified search-index parts
        run: python3 scripts/assemble-search-index.py
      - name: Commit assembled parts and drop probes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/search-index/part-*.b64
          git rm -f scripts/search-index/_probe-* || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Aligner le source : bandeau dans le flux, M57 opaque, 33/34 GitHub Release."
            git push
          fi
